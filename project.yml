name: SparkTrack
options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    iOS: "16.0"
targets:
  SparkTrack:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SparkTrack
    info:
      path: SparkTrack/Info.plist
    entitlements:
      path: SparkTrack/SparkTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.sparktrack
        INFOPLIST_FILE: SparkTrack/Info.plist
        SPARKTRACK_HEALTHKIT_ENABLED: "NO"