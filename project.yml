name: SparkTrack
options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    iOS: "16.0"
targets:
  SparkTrack:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SparkTrack
    info:
      path: SparkTrack/Info.plist
      properties:
        UILaunchStoryboardName: ""
    entitlements:
      path: SparkTrack/SparkTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.sparktrack
        INFOPLIST_FILE: SparkTrack/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""